name: Perception Engine Cloud Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Apply Perception Engine Patches
      run: |
        echo "Applying high-performance patches to Electron environment..."
        # This is where we would eventually add scripts to modify the node_modules/electron source
        # or download custom-compiled binaries.

    - name: Build Perception Launcher
      run: npm run build
      env:
        NODE_ENV: production
        ELECTRON_OPTIMIZE: true

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Perception-Launcher-Win64
        path: dist/*.exe
